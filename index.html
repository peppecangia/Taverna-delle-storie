<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17150f">
<meta name="description" content="Generatore per Dungeon Master: avventure con musiche integrate, schede personaggio complete, incontri bilanciati e luoghi illustrati per D&amp;D 3.5 e 5e.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forgia">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Forgia delle Avventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#0b0a09;color:#e7e3dc;
  font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  font-size:16px;line-height:1.6;overscroll-behavior:none;
}
:root{
  --bg:#0b0a09; --panel:#17150f; --panel2:#1f1c14;
  --line:#3a2f1c; --line2:#54432a;
  --gold:#d9a441; --gold-dim:#a8792c; --gold-soft:#f0d9a8;
  --ink:#e7e3dc; --ink-dim:#a39a8a; --ink-faint:#6e6558;
  --red:#b4483c; --green:#5f8a52; --blue:#4a7290; --purple:#7d5a96;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#17150f}
::-webkit-scrollbar-thumb{background:#54432a;border-radius:3px}

/* ── LAYOUT ── */
.wrap{display:flex;min-height:100dvh}
.side{
  position:sticky;top:0;width:250px;flex-shrink:0;height:100dvh;
  background:linear-gradient(180deg,#17150f,#120f0a);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand h1{
  margin:0;font-size:19px;letter-spacing:.5px;color:var(--gold);
  font-weight:600;line-height:1.2;
}
.brand p{margin:4px 0 0;font-size:11.5px;color:var(--ink-faint);letter-spacing:1.2px;text-transform:uppercase;font-family:system-ui,sans-serif}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;
  background:none;border:1px solid transparent;border-radius:9px;
  padding:10px 12px;margin-bottom:3px;cursor:pointer;text-align:left;
  color:var(--ink-dim);font-family:inherit;font-size:15px;transition:all .15s;
}
.nav button:hover{background:#211d15;color:var(--ink)}
.nav button.on{background:#2a2115;border-color:var(--line2);color:var(--gold-soft)}
.nav .ico{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav .sub{display:block;font-size:11px;color:var(--ink-faint);font-family:system-ui,sans-serif;letter-spacing:.2px}
.foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);font-family:system-ui,sans-serif;text-align:center;line-height:1.5}

.main{flex:1;min-width:0;padding:32px 36px 60px;max-width:900px}
.topbar{display:none}

/* ── TIPOGRAFIA ── */
h2.title{margin:0 0 4px;font-size:26px;color:var(--gold);font-weight:600;letter-spacing:.3px}
.lead{margin:0 0 22px;color:var(--ink-dim);font-size:14.5px;font-family:system-ui,sans-serif}
h3{margin:0;font-size:21px;color:var(--gold-soft);font-weight:600}

/* ── PANNELLI ── */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px;margin-bottom:16px;
}
.panel.hi{border-color:var(--line2);background:linear-gradient(180deg,#1f1a11,#17150f)}
.panel.warn{border-color:#5c3a2a;background:#1d1410}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}

/* ── CONTROLLI ── */
label.lab{
  display:block;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:7px;font-family:system-ui,sans-serif;font-weight:600;
}
.seg{display:flex;gap:6px}
.seg button{
  flex:1;padding:9px 6px;border-radius:8px;cursor:pointer;
  background:#221e16;border:1px solid var(--line);color:var(--ink-dim);
  font-family:system-ui,sans-serif;font-size:13px;font-weight:600;transition:all .15s;
}
.seg button:hover{border-color:var(--line2);color:var(--ink)}
.seg button.on{background:var(--gold-dim);border-color:var(--gold);color:#160f04}
select,input[type=text],input[type=number]{
  width:100%;padding:9px 11px;border-radius:8px;
  background:#221e16;border:1px solid var(--line);color:var(--ink);
  font-family:system-ui,sans-serif;font-size:14px;
}
select:focus,input:focus{outline:none;border-color:var(--gold-dim)}
input::placeholder{color:#5b5347}

.btn{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  padding:11px 20px;border-radius:9px;border:1px solid var(--gold);
  background:linear-gradient(180deg,#c99a3c,#a8792c);color:#160f04;
  font-family:system-ui,sans-serif;font-size:14.5px;font-weight:700;
  letter-spacing:.3px;transition:all .15s;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#221e16;border-color:var(--line2);color:var(--ink-dim)}
.btn.ghost:hover{color:var(--ink);border-color:var(--gold-dim)}
.btn.sm{padding:7px 13px;font-size:12.5px}

/* ── ELEMENTI ── */
.tag{
  display:inline-block;padding:3px 9px;border-radius:5px;font-size:11.5px;
  font-family:system-ui,sans-serif;font-weight:600;letter-spacing:.3px;
  background:#2e2416;border:1px solid var(--line2);color:var(--gold-soft);
}
.tag.red{background:#33191a;border-color:#6b3230;color:#e0958c}
.tag.green{background:#1b2a19;border-color:#3d5c37;color:#a3c99a}
.tag.blue{background:#182430;border-color:#345168;color:#94bcd6}
.tag.purple{background:#241a2e;border-color:#4d3663;color:#c4a5da}

.lbl{
  font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-faint);
  font-family:system-ui,sans-serif;font-weight:600;margin:0 0 8px;
}
blockquote{
  margin:0;padding:2px 0 2px 16px;border-left:2px solid var(--gold-dim);
  font-style:italic;color:#ddd6c8;line-height:1.75;
}
.ascii{
  font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;
  font-size:11px;line-height:1.15;white-space:pre;overflow-x:auto;
  background:#08070500;background:#080705;color:#c99a3c;
  padding:14px;border-radius:8px;border:1px solid var(--line);margin:0;
}
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stat{background:#221e16;border:1px solid var(--line);border-radius:8px;padding:7px 3px;text-align:center}
.stat .n{font-size:10px;color:var(--ink-faint);letter-spacing:.8px;font-family:system-ui,sans-serif}
.stat .v{font-size:19px;color:var(--gold);font-weight:700;line-height:1.2}
.stat .m{font-size:11px;color:var(--ink-dim);font-family:system-ui,sans-serif}

.enemy{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px}
.enemy .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.enemy .nm{font-size:16.5px;color:var(--gold-soft);font-weight:600}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{font-size:11.5px;padding:2px 8px;border-radius:5px;font-family:system-ui,sans-serif;font-weight:600}
.pip.hp{background:#33191a;color:#e0958c}
.pip.ac{background:#182430;color:#94bcd6}
.pip.xp{background:#2e2416;color:var(--gold-soft)}

.room{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.room .id{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:5px;background:#3a2d18;
  color:var(--gold);font-weight:700;font-size:13px;margin-right:9px;
  font-family:system-ui,sans-serif;
}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin-bottom:5px;color:#d5cec1;font-size:14.5px}

.track{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:11px 13px;margin-bottom:7px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  color:var(--ink-dim);font-family:inherit;font-size:14.5px;text-align:left;transition:all .15s;
}
.track:hover{border-color:var(--line2)}
.track.on{border-color:var(--gold-dim);background:#251e12;color:var(--gold-soft)}
.track .desc{font-size:12px;color:var(--ink-faint);font-family:system-ui,sans-serif;margin-top:3px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.eq i{width:3px;background:var(--gold);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(1){height:5px;animation-delay:0s}
.eq i:nth-child(2){height:11px;animation-delay:.15s}
.eq i:nth-child(3){height:7px;animation-delay:.3s}
.eq i:nth-child(4){height:13px;animation-delay:.45s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

.fade{animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.dim{color:var(--ink-faint)}
.sm{font-size:13.5px}
.mt{margin-top:14px}
.rowbtn{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--ink-faint);font-family:system-ui,sans-serif;margin-top:9px}
.legend{font-size:11.5px;color:var(--ink-faint);font-family:system-ui,sans-serif;margin-top:9px;line-height:1.7}

/* ── MOBILE ── */
@media(max-width:860px){
  body{font-size:15.5px}
  .side{
    position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);
    transition:transform .25s ease;box-shadow:0 0 40px #000a;
  }
  .side.open{transform:translateX(0)}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:50;padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top,0px));
    background:#17150f;border-bottom:1px solid var(--line);
  }
  .topbar .t{font-size:16px;color:var(--gold);font-weight:600}
  .topbar button{
    background:none;border:1px solid var(--line);border-radius:8px;
    width:38px;height:38px;color:var(--ink);font-size:17px;cursor:pointer;
  }
  .main{padding:20px 16px 100px;max-width:100%}
  .g2,.g3{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;background:#000b;z-index:55}
  .botnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:#17150f;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .botnav button{
    flex:1;background:none;border:none;padding:9px 2px 8px;cursor:pointer;
    color:var(--ink-faint);font-family:system-ui,sans-serif;font-size:10.5px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .botnav button.on{color:var(--gold)}
  .botnav .ico{font-size:18px;line-height:1}
  .ascii{font-size:9px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  h2.title{font-size:22px}
}
@media(min-width:861px){ .botnav{display:none} .scrim{display:none} }
@media print{
  .side,.topbar,.botnav,.btn,.rowbtn{display:none!important}
  body{background:#fff;color:#000}
  .panel{border-color:#ccc;background:#fff;break-inside:avoid}
  .ascii{background:#f6f6f6;color:#000;border-color:#ccc}
  h2.title,h3,.lbl{color:#000}
}

/* ══════ AGGIUNTE: musica, illustrazioni, scene ══════ */
.panel.err{border-color:#6b3230;background:#1d1210}
.panel.gold{border-color:var(--line2);background:#1c1710}

.wait{display:flex;align-items:center;gap:12px;color:var(--gold)}
.spin{
  width:20px;height:20px;flex-shrink:0;border-radius:50%;
  border:2px solid #493719;border-top-color:var(--gold);
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* Blocco musica dentro le scene */
.mus{
  margin-top:13px;padding:12px 14px;border-radius:10px;
  background:#191a22;border:1px solid #333a52;
}
.mus-h{display:flex;align-items:flex-start;gap:11px}
.mus-i{
  flex-shrink:0;width:28px;height:28px;border-radius:7px;
  background:#2b3050;border:1px solid #3f4770;color:#a9b4e8;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.mus-t{color:#bcc4ee;font-weight:600;font-size:14.5px;line-height:1.35}
.mus-d{color:#7d84a6;font-size:12.5px;font-family:system-ui,sans-serif;margin-top:3px;line-height:1.5}
.mus-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-left:39px}
.lnk{
  display:inline-block;padding:5px 11px;border-radius:6px;text-decoration:none;
  background:#242a40;border:1px solid #3a4266;color:#a9b4e8;
  font-family:system-ui,sans-serif;font-size:12px;font-weight:600;transition:all .15s;
}
.lnk:hover{background:#2e3654;color:#cdd4ff}

/* Illustrazioni */
.illu{margin:0 0 14px;padding:0}
.illu-box{
  position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
  border-radius:10px;border:1px solid var(--line);background:#100d09;
}
.illu-img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.illu-box.ok .illu-img{opacity:1}
.illu-box.ok .illu-load{display:none}
.illu-load{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);font-family:system-ui,sans-serif;font-size:12.5px;letter-spacing:.5px;
}
.illu figcaption{
  margin-top:7px;color:var(--ink-faint);font-size:12.5px;
  font-family:system-ui,sans-serif;text-align:center;
}

/* Atti e scene */
.atto{border-left:2px solid var(--line2);padding:0 0 0 15px;margin-bottom:20px}
.atto:last-child{margin-bottom:0}
.atto-h{display:flex;align-items:center;gap:10px}
.scena{
  margin-top:12px;padding:13px 15px;border-radius:10px;
  background:#1d1810;border:1px solid var(--line);
}
.luo{margin-bottom:22px}
.luo:last-child{margin-bottom:0}
.luo-t{padding:0 2px}
.voce{padding:9px 0;border-bottom:1px solid #241f16}
.voce:last-child{border-bottom:none;padding-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-block;padding:4px 10px;border-radius:6px;
  background:#221e16;border:1px solid var(--line);color:#cfc7b8;
  font-family:system-ui,sans-serif;font-size:12.5px;
}
@media(max-width:860px){
  .mus-a{padding-left:0}
  .atto{padding-left:12px}
}
@media print{
  .mus{background:#f4f4f8;border-color:#bbb}
  .mus-t,.mus-d{color:#000}
  .lnk{display:none}
  .illu-box{border-color:#ccc}
  .scena{background:#f8f6f2;border-color:#ccc}
  .chip{background:#f2f0ec;color:#000;border-color:#ccc}
}

</style>
</head>
<body>
<noscript><p style="padding:40px;color:#d9a441;font-family:Georgia,serif">Questa applicazione richiede JavaScript attivo.</p></noscript>
<script>
/* ═════ ILLUSTRAZIONI ═════ */
/* ══════════════ IMMAGINI ══════════════
   1) Prova a generare un'illustrazione via servizio pubblico (nessuna chiave).
   2) Se non risponde, disegna una scena SVG procedurale: qualcosa si vede sempre.
   ══════════════════════════════════════ */

const STILE_ART = "fantasy illustration, dungeons and dragons concept art, painterly, dramatic lighting, no text, no watermark";

function urlImmagine(descrizione, seed){
  const p = encodeURIComponent(`${descrizione}, ${STILE_ART}`);
  return `https://image.pollinations.ai/prompt/${p}?width=896&height=504&seed=${seed}&nologo=true`;
}

/* ── Palette per tipo di ambiente ── */
const PALETTE = {
  "Dungeon sotterraneo": {cielo:["#120d0a","#241812"], terra:"#0d0908", acc:"#c9762f", neb:"#3a2418"},
  "Foresta antica":      {cielo:["#0d1710","#1d3323"], terra:"#08120c", acc:"#6fa85f", neb:"#25422e"},
  "Città medievale":     {cielo:["#1a1712","#3d3324"], terra:"#100d09", acc:"#d9a441", neb:"#4a3d2a"},
  "Montagna innevata":   {cielo:["#101720","#2b3a4d"], terra:"#0a0e14", acc:"#a9c8e0", neb:"#3d5066"},
  "Palude nebbiosa":     {cielo:["#0e1412","#1f2e28"], terra:"#080d0b", acc:"#6f9a7a", neb:"#2c4038"},
  "Deserto arcano":      {cielo:["#1c1409","#43301a"], terra:"#120c06", acc:"#e0a94f", neb:"#573f22"},
  "Porto costiero":      {cielo:["#0c1319","#25404f"], terra:"#070c10", acc:"#69a8c0", neb:"#2f4f60"},
  "Castello in rovina":  {cielo:["#14110d","#302719"], terra:"#0b0906", acc:"#b8903f", neb:"#3d3121"},
  "Villaggio rurale":    {cielo:["#151109","#3a2d18"], terra:"#0c0906", acc:"#cf9a45", neb:"#463620"},
  "Piano degli inferi":  {cielo:["#180909","#3d1210"], terra:"#0f0605", acc:"#e04a2c", neb:"#521b14"},
};

function _rng(seed){
  let s = seed >>> 0 || 1;
  return () => { s ^= s<<13; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
}

/* Genera una scena a strati: cielo, astro, foschia, silhouette, primo piano */
function svgScena(tipo, seed){
  const P = PALETTE[tipo] || PALETTE["Dungeon sotterraneo"];
  const R = _rng(seed);
  const W = 896, H = 504;
  const parti = [];

  parti.push(`<defs>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${P.cielo[0]}"/><stop offset="100%" stop-color="${P.cielo[1]}"/>
    </linearGradient>
    <radialGradient id="gl" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="${P.acc}" stop-opacity=".38"/>
      <stop offset="100%" stop-color="${P.acc}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${P.neb}" stop-opacity=".55"/>
      <stop offset="100%" stop-color="${P.terra}" stop-opacity="1"/>
    </linearGradient>
  </defs>`);

  parti.push(`<rect width="${W}" height="${H}" fill="url(#sk)"/>`);

  /* astro */
  const ax = 140 + R()*620, ay = 70 + R()*90, ar = 26 + R()*22;
  parti.push(`<circle cx="${ax.toFixed(0)}" cy="${ay.toFixed(0)}" r="${(ar*3.4).toFixed(0)}" fill="${P.acc}" opacity=".07"/>`);
  parti.push(`<circle cx="${ax.toFixed(0)}" cy="${ay.toFixed(0)}" r="${ar.toFixed(0)}" fill="${P.acc}" opacity=".5"/>`);

  /* stelle o scintille */
  for(let i=0;i<46;i++){
    const x=R()*W, y=R()*H*0.55, r=R()*1.5+.3;
    parti.push(`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#fff" opacity="${(R()*.4+.08).toFixed(2)}"/>`);
  }

  /* creste lontane */
  for(let strato=0; strato<3; strato++){
    const base = H*0.50 + strato*54;
    const amp  = 46 - strato*11;
    let d = `M0,${H} L0,${base.toFixed(0)}`;
    for(let x=0; x<=W; x+=28){
      const y = base - Math.sin((x/W)*Math.PI*(1.4+strato*0.7) + R()*0.4)*amp - R()*14;
      d += ` L${x},${y.toFixed(0)}`;
    }
    d += ` L${W},${H} Z`;
    const op = (0.42 + strato*0.19).toFixed(2);
    parti.push(`<path d="${d}" fill="${P.terra}" opacity="${op}"/>`);
  }

  /* silhouette caratterizzanti per tipo */
  const suolo = H*0.78;
  const sil = [];
  const T = tipo || "";
  if(T.includes("Foresta") || T.includes("Palude")){
    for(let i=0;i<11;i++){
      const x = R()*W, h = 90+R()*140, w = 5+R()*7;
      sil.push(`<rect x="${x.toFixed(0)}" y="${(suolo-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${P.terra}"/>`);
      for(let b=0;b<4;b++){
        const by = suolo-h+18+b*26, len = 26+R()*34, dir = R()<.5?-1:1;
        sil.push(`<path d="M${(x+w/2).toFixed(0)},${by.toFixed(0)} q${(dir*len/2).toFixed(0)},-14 ${(dir*len).toFixed(0)},-24" stroke="${P.terra}" stroke-width="3.5" fill="none"/>`);
      }
    }
  } else if(T.includes("Città") || T.includes("Villaggio") || T.includes("Porto")){
    let x = -20;
    while(x < W){
      const w = 46+R()*72, h = 60+R()*118;
      sil.push(`<rect x="${x.toFixed(0)}" y="${(suolo-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${P.terra}"/>`);
      sil.push(`<path d="M${x.toFixed(0)},${(suolo-h).toFixed(0)} L${(x+w/2).toFixed(0)},${(suolo-h-26-R()*22).toFixed(0)} L${(x+w).toFixed(0)},${(suolo-h).toFixed(0)} Z" fill="${P.terra}"/>`);
      for(let f=0; f<Math.floor(h/34); f++){
        if(R()<.45) continue;
        sil.push(`<rect x="${(x+10+R()*(w-26)).toFixed(0)}" y="${(suolo-h+22+f*32).toFixed(0)}" width="7" height="10" fill="${P.acc}" opacity=".65"/>`);
      }
      x += w + 6 + R()*20;
    }
  } else if(T.includes("Castello")){
    const bx = W*0.28, bw = W*0.44;
    sil.push(`<rect x="${bx.toFixed(0)}" y="${(suolo-150).toFixed(0)}" width="${bw.toFixed(0)}" height="150" fill="${P.terra}"/>`);
    [bx-4, bx+bw*0.42, bx+bw-52].forEach((tx,i)=>{
      const th = 190+R()*70;
      sil.push(`<rect x="${tx.toFixed(0)}" y="${(suolo-th).toFixed(0)}" width="56" height="${th.toFixed(0)}" fill="${P.terra}"/>`);
      for(let m=0;m<4;m++) sil.push(`<rect x="${(tx+m*15).toFixed(0)}" y="${(suolo-th-11).toFixed(0)}" width="9" height="12" fill="${P.terra}"/>`);
      if(R()<.7) sil.push(`<rect x="${(tx+22).toFixed(0)}" y="${(suolo-th+42).toFixed(0)}" width="9" height="14" fill="${P.acc}" opacity=".6"/>`);
    });
  } else if(T.includes("Montagna")){
    for(let i=0;i<4;i++){
      const px = R()*W, ph = 150+R()*130, pw = 150+R()*130;
      sil.push(`<path d="M${(px-pw/2).toFixed(0)},${suolo.toFixed(0)} L${px.toFixed(0)},${(suolo-ph).toFixed(0)} L${(px+pw/2).toFixed(0)},${suolo.toFixed(0)} Z" fill="${P.terra}"/>`);
      sil.push(`<path d="M${(px-26).toFixed(0)},${(suolo-ph+40).toFixed(0)} L${px.toFixed(0)},${(suolo-ph).toFixed(0)} L${(px+26).toFixed(0)},${(suolo-ph+40).toFixed(0)} Z" fill="#e8eef4" opacity=".28"/>`);
    }
  } else {
    /* dungeon / deserto / piani: arcate e colonne */
    for(let i=0;i<5;i++){
      const cx = 70 + i*(W-140)/4 + (R()-.5)*30;
      const ch = 130+R()*90, cw = 30+R()*16;
      sil.push(`<rect x="${(cx-cw/2).toFixed(0)}" y="${(suolo-ch).toFixed(0)}" width="${cw.toFixed(0)}" height="${ch.toFixed(0)}" fill="${P.terra}"/>`);
      sil.push(`<rect x="${(cx-cw/2-8).toFixed(0)}" y="${(suolo-ch-13).toFixed(0)}" width="${(cw+16).toFixed(0)}" height="13" fill="${P.terra}"/>`);
    }
    const gx = W/2, gh = 176;
    sil.push(`<path d="M${(gx-84).toFixed(0)},${suolo.toFixed(0)} L${(gx-84).toFixed(0)},${(suolo-gh+72).toFixed(0)} Q${gx.toFixed(0)},${(suolo-gh-46).toFixed(0)} ${(gx+84).toFixed(0)},${(suolo-gh+72).toFixed(0)} L${(gx+84).toFixed(0)},${suolo.toFixed(0)} Z" fill="${P.terra}"/>`);
    sil.push(`<path d="M${(gx-52).toFixed(0)},${suolo.toFixed(0)} L${(gx-52).toFixed(0)},${(suolo-gh+82).toFixed(0)} Q${gx.toFixed(0)},${(suolo-gh-6).toFixed(0)} ${(gx+52).toFixed(0)},${(suolo-gh+82).toFixed(0)} L${(gx+52).toFixed(0)},${suolo.toFixed(0)} Z" fill="${P.acc}" opacity=".22"/>`);
  }
  parti.push(sil.join(""));

  /* bagliore, foschia, primo piano, vignettatura */
  parti.push(`<rect width="${W}" height="${H}" fill="url(#gl)"/>`);
  parti.push(`<rect x="0" y="${(H*0.62).toFixed(0)}" width="${W}" height="${(H*0.38).toFixed(0)}" fill="url(#fg)"/>`);
  parti.push(`<path d="M0,${H} L0,${(H-46).toFixed(0)} Q${(W*0.3).toFixed(0)},${(H-84).toFixed(0)} ${(W*0.55).toFixed(0)},${(H-52).toFixed(0)} Q${(W*0.8).toFixed(0)},${(H-24).toFixed(0)} ${W},${(H-62).toFixed(0)} L${W},${H} Z" fill="${P.terra}"/>`);
  parti.push(`<rect width="${W}" height="${H}" fill="none" stroke="#000" stroke-width="70" opacity=".26"/>`);

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid slice">${parti.join("")}</svg>`;
}

function svgDataUri(tipo, seed){
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgScena(tipo, seed));
}

<script>
/* ═════ LIVELLO AI ═════ */
/* ══════════════ LIVELLO AI ══════════════
   Le chiamate passano da /api/claude (funzione Netlify) che custodisce la chiave.
   ════════════════════════════════════════ */

async function chiediAI(prompt, maxTok){
  const r = await fetch("/api/claude", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ max_tokens: maxTok||3000, messages:[{role:"user",content:prompt}] })
  });
  let d;
  try { d = await r.json(); } catch(e){ throw new Error("Risposta del server non leggibile."); }
  if(!r.ok || d.error){
    const msg = (d && (d.error?.message || d.error)) || ("Errore "+r.status);
    if(String(msg).includes("ANTHROPIC_API_KEY"))
      throw new Error("La chiave API non è ancora configurata su Netlify. Vedi il file LEGGIMI.");
    if(r.status===401) throw new Error("Chiave API non valida o scaduta.");
    if(r.status===429) throw new Error("Troppe richieste ravvicinate. Attendi qualche secondo e riprova.");
    if(r.status===529 || r.status===503) throw new Error("Il servizio è momentaneamente sovraccarico. Riprova tra poco.");
    throw new Error(String(msg));
  }
  return (d.content||[]).map(b=>b.text||"").join("");
}

function estraiJSON(txt){
  if(!txt) return null;
  let s = txt.trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence) s = fence[1].trim();
  try { return JSON.parse(s); } catch(e){}
  const i = s.indexOf("{"), j = s.lastIndexOf("}");
  if(i>=0 && j>i){
    const dentro = s.slice(i, j+1);
    try { return JSON.parse(dentro); } catch(e){}
    try { return JSON.parse(dentro.replace(/,\s*([}\]])/g, "$1")); } catch(e){}
  }
  return null;
}

async function generaJSON(prompt, maxTok){
  const grezzo = await chiediAI(prompt, maxTok);
  const dati = estraiJSON(grezzo);
  if(!dati) throw new Error("La risposta non era nel formato atteso. Riprova.");
  return dati;
}

  const abbr={Forza:"FOR",Destrezza:"DES",Costituzione:"COS",Intelligenza:"INT",Saggezza:"SAG",Carisma:"CAR"};
  const inc=o.incantesimi||{};
  const cmp=o.competenze||{};
  return `<div class="fade">
  <div class="panel hi">
    ${o.immagine?illustrazione(o.immagine,"Castello in rovina",null):""}
    <h3>${esc(o.nome)}</h3>
    <p class="sm dim" style="margin:6px 0 10px">
      ${esc(o.razza)}${o.sottorazza?` (${esc(o.sottorazza)})`:""} ·
      ${esc(o.classe)}${o.sottoclasse?` — ${esc(o.sottoclasse)}`:""} ·
      Livello ${esc(o.livello)}${o.background?` · ${esc(o.background)}`:""}</p>
    <div class="rowbtn">
      <span class="tag purple">${esc(o.allineamento)}</span>
      <span class="tag red">${esc(o.pf)} PF</span>
      <span class="tag blue">CA ${esc(o.ca)}</span>
      ${o.bonus_competenza?`<span class="tag">Competenza ${esc(o.bonus_competenza)}</span>`:""}
      ${o.iniziativa?`<span class="tag">Iniziativa ${esc(o.iniziativa)}</span>`:""}
      ${o.velocita?`<span class="tag">${esc(o.velocita)}</span>`:""}
    </div>
    ${o.citazione?`<blockquote style="margin-top:12px">${esc(o.citazione)}</blockquote>`:""}
  </div>

  <div class="panel"><p class="lbl">Caratteristiche</p>
    <div class="stat-grid">${ordine.map(k=>`
      <div class="stat"><div class="n">${abbr[k]}</div>
        <div class="v">${esc(C[k]??"—")}</div>
        <div class="m">${esc(M[k]??"")}</div></div>`).join("")}</div>
    ${o.dado_vita?`<p class="hint">Dado vita: ${esc(o.dado_vita)}</p>`:""}

  <div class="grid g2">
    ${arr(o.tiri_salvezza).length?`<div class="panel"><p class="lbl">Tiri salvezza</p>
      <div class="chips">${arr(o.tiri_salvezza).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`:""}
    ${arr(o.abilita).length?`<div class="panel"><p class="lbl">Abilità</p>
      <div class="chips">${arr(o.abilita).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`:""}
  </div>

  ${(arr(cmp.armature).length||arr(cmp.armi).length||arr(cmp.strumenti).length||arr(cmp.linguaggi).length)?`
  <div class="panel"><p class="lbl">Competenze</p>
    ${arr(cmp.armature).length?`<p class="sm"><span class="dim">Armature — </span>${esc(arr(cmp.armature).join(", "))}</p>`:""}
    ${arr(cmp.armi).length?`<p class="sm"><span class="dim">Armi — </span>${esc(arr(cmp.armi).join(", "))}</p>`:""}
    ${arr(cmp.strumenti).length?`<p class="sm"><span class="dim">Strumenti — </span>${esc(arr(cmp.strumenti).join(", "))}</p>`:""}
    ${arr(cmp.linguaggi).length?`<p class="sm"><span class="dim">Linguaggi — </span>${esc(arr(cmp.linguaggi).join(", "))}</p>`:""}
  </div>`:""}

  ${arr(o.talenti).length?`<div class="panel gold"><p class="lbl">Talenti</p>
    ${arr(o.talenti).map(t=>`<div class="voce"><b>${esc(t.nome)}</b>
      <p class="sm dim" style="margin:3px 0 0">${esc(t.effetto||t.descrizione||"")}</p></div>`).join("")}
  </div>`:(o.note_progressione?`<div class="panel"><p class="lbl">Talenti</p>
    <p class="sm dim">${esc(o.note_progressione)}</p></div>`:"")}

  ${arr(o.tratti_razziali).length?`<div class="panel"><p class="lbl">Tratti razziali</p>
    ${arr(o.tratti_razziali).map(t=>`<div class="voce"><b>${esc(t.nome)}</b>
      <p class="sm dim" style="margin:3px 0 0">${esc(t.effetto||t.descrizione||"")}</p></div>`).join("")}
  </div>`:""}

  ${arr(o.privilegi_classe).length?`<div class="panel"><p class="lbl">Privilegi di classe</p>
    ${arr(o.privilegi_classe).map(t=>`<div class="voce">
      <b>${esc(t.nome)}</b>${t.livello?`<span class="tag" style="margin-left:7px">liv. ${esc(t.livello)}</span>`:""}
      <p class="sm dim" style="margin:3px 0 0">${esc(t.effetto||t.descrizione||"")}</p></div>`).join("")}

  ${(inc.presente!==false && (arr(inc.trucchetti).length||arr(inc.conosciuti).length))?`

    ${arr(inc.trucchetti).length?`<p class="sm"><span class="dim">Trucchetti — </span>${esc(arr(inc.trucchetti).join(", "))}</p>`:""}
    ${arr(inc.conosciuti).length?`<p class="sm mt"><span class="dim">Conosciuti — </span>${esc(arr(inc.conosciuti).join(", "))}</p>`:""}
  </div>`:""}

  <div class="grid g2">
    ${arr(o.equipaggiamento).length?`<div class="panel"><p class="lbl">Equipaggiamento</p>
      <ul class="clean">${arr(o.equipaggiamento).map(e=>`<li class="sm">${esc(e)}</li>`).join("")}</ul>

    <div class="panel"><p class="lbl">Carattere</p>
      ${o.personalita?`<p class="sm"><span class="dim">Tratto — </span>${esc(o.personalita)}</p>`:""}
      ${o.ideale?`<p class="sm"><span class="dim">Ideale — </span>${esc(o.ideale)}</p>`:""}
      ${o.legame?`<p class="sm"><span class="dim">Legame — </span>${esc(o.legame)}</p>`:""}
      ${o.difetto?`<p class="sm"><span class="dim">Difetto — </span>${esc(o.difetto)}</p>`:""}
    </div>
  </div>

  ${o.aspetto?`<div class="panel"><p class="lbl">Aspetto</p><p class="sm">${esc(o.aspetto)}</p></div>`:""}
  ${o.storia?`<div class="panel"><p class="lbl">Storia</p><p class="sm">${esc(o.storia)}</p></div>`:""}
  ${o.consiglio_gioco?`<div class="panel gold"><p class="lbl">Come giocarlo</p><p class="sm">${esc(o.consiglio_gioco)}</p></div>`:""}
  ${barra("pg")}</div>`;

    ${arr(o.zone).map(z=>`<div class="room">
      ${z.immagine?illustrazione(z.immagine,tipo,z.nome):""}
      <div><span class="id">${esc(z.id)}</span><b style="color:var(--gold-soft)">${esc(z.nome)}</b></div>
      <p class="sm" style="margin:8px 0 4px">${esc(z.descrizione)}</p>
      ${z.contenuto?`<p class="sm dim">Contiene: ${esc(z.contenuto)}</p>`:""}
      ${z.pericolo&&z.pericolo!=="null"?`<p class="sm" style="color:#d99080">Pericolo: ${esc(z.pericolo)}</p>`:""}
    </div>`).join("")}
  </div>
  ${arr(o.png).length?`<div class="panel"><p class="lbl">Personaggi del luogo</p>
    ${arr(o.png).map(p=>`<div class="voce"><b>${esc(p.nome)}</b>
      <p class="sm dim" style="margin:3px 0 0">${esc(p.ruolo)}${p.atteggiamento?` · ${esc(p.atteggiamento)}`:""}</p></div>`).join("")}</div>`:""}
  <div class="grid g2">
    ${arr(o.segreti).length?`<div class="panel"><p class="lbl">Segreti</p>
      <ul class="clean">${arr(o.segreti).map(s=>`<li class="sm">${esc(s)}</li>`).join("")}</ul></div>`:""}
    ${arr(o.tesori).length?`<div class="panel"><p class="lbl">Tesori</p>
      <ul class="clean">${arr(o.tesori).map(t=>`<li class="sm">${esc(t)}</li>`).join("")}</ul></div>`:""}
  </div>
  ${o.note_dm?`<div class="panel gold"><p class="lbl">Nota per il DM</p><p class="sm">${esc(o.note_dm)}</p></div>`:""}
  ${barra("luogo")}</div>`;
}

/* ══════ DADI ══════ */
function vDadi(){
  const log=ST.dadi.log;
  return `
  <h2 class="title">Dadi</h2>
  <p class="lead">Tiri rapidi al tavolo. Funziona anche se la connessione manca.</p>
  <div class="panel">
    <div class="rowbtn">
      ${[4,6,8,10,12,20,100].map(d=>`<button class="btn ghost sm" data-die="${d}">d${d}</button>`).join("")}
      <button class="btn ghost sm" data-die="adv">2d20 vantaggio</button>
      <button class="btn ghost sm" data-die="dis">2d20 svantaggio</button>
      <button class="btn ghost sm" data-die="stat">4d6 caratteristica</button>
      <button class="btn ghost sm" id="clr">Pulisci</button>
    </div>
    ${log.length?`<div class="mt">${log.slice(0,14).map((l,i)=>
      `<p class="sm" style="margin:4px 0;${i===0?"color:var(--gold);font-size:17px":"color:var(--ink-dim)"}">${esc(l)}</p>`).join("")}</div>`:""}
  </div>`;
}

/* ══════ ESPORTAZIONE ══════ */
function testo(kind){
  const R=[], L=(...a)=>R.push(a.join("")), HR=()=>R.push("─".repeat(58));
  const musL=(m,et)=>{ if(m&&m.mood) L("   ♪ ",m.mood,et?" ("+et+")":"","  — ",m.descrizione||"",m.bpm?" · "+m.bpm+" BPM":"", m.ricerca?"  [cerca: "+m.ricerca+"]":""); };
  if(kind==="storia"){
    const o=ST.storia.out; if(!o) return "";
    L(String(o.titolo).toUpperCase()); HR(); L(o.logline); L("");
    L("D&D ",ST.storia.ed," · ",ST.storia.formato==="oneshot"?"One-Shot":"Campagna"," · ",ST.storia.nPG," PG di livello ",ST.storia.lv); L("");
    if(o.apertura){ L("APERTURA (da leggere)"); L(o.apertura.testo||o.apertura); musL(o.apertura.musica,"apertura"); L(""); }
    L("PREMESSA"); L(o.premessa); L("");
    L("AGGANCIO"); L(o.hook); L("");
    if(arr(o.luoghi).length){ L("LUOGHI"); arr(o.luoghi).forEach(l=>{ L("  • ",l.nome," (",l.tipo||"",")"); L("    ",l.descrizione); }); L(""); }
    L("ATTI");
    arr(o.atti).forEach((a,i)=>{
      L("  ",i+1,". ",a.titolo); L("     ",a.descrizione);
      if(a.sfide) L("     Sfide: ",a.sfide);
      if(a.scena_chiave){ L("     Scena: ",a.scena_chiave.nome||""); L("     \"",a.scena_chiave.testo,"\""); musL(a.scena_chiave.musica,"atto "+(i+1)); }
    }); L("");
    if(o.antagonista){ L("ANTAGONISTA: ",o.antagonista.nome," — ",o.antagonista.ruolo||"");
      L("  Movente: ",o.antagonista.movente); L("  Tattica: ",o.antagonista.tattica); musL(o.antagonista.musica,"scontro finale"); L(""); }
    if(o.twist){ L("COLPO DI SCENA"); L(o.twist); L(""); }
    if(arr(o.ricompense).length){ L("RICOMPENSE"); arr(o.ricompense).forEach(r=>L("  - ",r)); L(""); }
    if(o.note_dm){ L("NOTE DM"); L(o.note_dm); }
  }
  if(kind==="pg"){
    const o=ST.pg.out; if(!o) return "";
    const C=o.caratteristiche||{}, M=o.modificatori||{};
    L(String(o.nome).toUpperCase()); HR();
    L(o.razza,o.sottorazza?" ("+o.sottorazza+")":""," ",o.classe,o.sottoclasse?" — "+o.sottoclasse:""," di livello ",o.livello);
    L(o.allineamento,o.background?" · "+o.background:"");
    L(o.pf," PF · CA ",o.ca,o.bonus_competenza?" · competenza "+o.bonus_competenza:"",o.iniziativa?" · iniziativa "+o.iniziativa:"",o.velocita?" · "+o.velocita:""); L("");
    L("CARATTERISTICHE");
    L("  ",["Forza","Destrezza","Costituzione","Intelligenza","Saggezza","Carisma"].map(k=>k.slice(0,3).toUpperCase()+" "+(C[k]??"—")+" ("+(M[k]??"")+")").join("  ")); L("");
    if(arr(o.tiri_salvezza).length) L("TIRI SALVEZZA: ",arr(o.tiri_salvezza).join(", "));
    if(arr(o.abilita).length) L("ABILITÀ: ",arr(o.abilita).join(", ")); L("");
    if(arr(o.talenti).length){ L("TALENTI"); arr(o.talenti).forEach(t=>{ L("  • ",t.nome); L("    ",t.effetto||t.descrizione||""); }); L(""); }
    else if(o.note_progressione){ L("TALENTI: ",o.note_progressione); L(""); }
    if(arr(o.tratti_razziali).length){ L("TRATTI RAZZIALI"); arr(o.tratti_razziali).forEach(t=>L("  • ",t.nome,": ",t.effetto||t.descrizione||"")); L(""); }
    if(arr(o.privilegi_classe).length){ L("PRIVILEGI DI CLASSE"); arr(o.privilegi_classe).forEach(t=>L("  • ",t.nome,t.livello?" (liv. "+t.livello+")":"",": ",t.effetto||t.descrizione||"")); L(""); }
    const inc=o.incantesimi||{};
    if(inc.presente!==false&&(arr(inc.trucchetti).length||arr(inc.conosciuti).length)){
      L("INCANTESIMI",inc.caratteristica?" ("+inc.caratteristica+")":"");
      if(inc.cd_tiro_salvezza) L("  CD ",inc.cd_tiro_salvezza,inc.bonus_attacco?" · attacco "+inc.bonus_attacco:"");
      if(inc.slot) L("  Slot: ",inc.slot);
      if(arr(inc.trucchetti).length) L("  Trucchetti: ",arr(inc.trucchetti).join(", "));
      if(arr(inc.conosciuti).length) L("  Conosciuti: ",arr(inc.conosciuti).join(", ")); L("");
    }
    if(arr(o.equipaggiamento).length){ L("EQUIPAGGIAMENTO"); arr(o.equipaggiamento).forEach(e=>L("  - ",e)); if(o.monete) L("  Monete: ",o.monete); L(""); }
    L("CARATTERE");
    if(o.personalita) L("  Tratto: ",o.personalita);
    if(o.ideale) L("  Ideale: ",o.ideale);
    if(o.legame) L("  Legame: ",o.legame);
    if(o.difetto) L("  Difetto: ",o.difetto); L("");
    if(o.aspetto){ L("ASPETTO"); L(o.aspetto); L(""); }
    if(o.storia){ L("STORIA"); L(o.storia); L(""); }
    if(o.citazione) L("CITAZIONE: ",o.citazione);
    if(o.consiglio_gioco){ L(""); L("COME GIOCARLO: ",o.consiglio_gioco); }
  }
  if(kind==="incontro"){
    const o=ST.incontro.out; if(!o) return "";
    L(String(o.nome).toUpperCase()); HR();
    L("Difficoltà ",ST.incontro.diff," · ",ST.incontro.np," PG di livello ",ST.incontro.lv);
    L(o.ambiente); L("");
    if(o.lettura){ L("DA LEGGERE"); L(o.lettura); }
    musL(o.musica,"combattimento"); L("");
    L("NEMICI");
    arr(o.nemici).forEach(n=>{
      L("  ",n.quantita||1,"x ",n.nome," (",n.tipo||"",n.gs?", GS "+n.gs:"",")");
      L("     ",n.pf," PF · CA ",n.ca,n.velocita?" · "+n.velocita:"");
      arr(n.attacchi).forEach(a=>L("     ",a.nome," ",a.bonus," — ",a.danni));
      if(n.tratti) L("     ",n.tratti);
    }); L("");
    L("PE totali: ",o.xp_totale); L("");
    L("TATTICHE: ",o.tattiche);
    L("COMPLICAZIONE: ",o.complicazione);
    if(o.terreno) L("TERRENO: ",o.terreno); L("");
    L("Vittoria: ",o.vittoria);
    L("Sconfitta: ",o.sconfitta); L("");
    if(arr(o.bottino).length){ L("BOTTINO"); arr(o.bottino).forEach(b=>L("  - ",b)); }
    if(o.note_dm){ L(""); L("NOTE DM: ",o.note_dm); }
  }
  if(kind==="luogo"){
    const o=ST.luogo.out; if(!o) return "";
    L(String(o.nome).toUpperCase()); HR();
    L(o.tipo||ST.luogo.tipo," · ",arr(o.zone).length," zone");
    L(o.descrizione);
    if(o.atmosfera) L("Atmosfera: ",o.atmosfera,o.sensi?" · "+o.sensi:""); L("");
    if(o.ingresso){ L("ALL'ARRIVO (da leggere)"); L(o.ingresso.testo||o.ingresso); musL(o.ingresso.musica,"ingresso"); L(""); }
    musL(o.musica_esplorazione,"esplorazione"); L("");
    L("ZONE");
    arr(o.zone).forEach(z=>{
      L("  [",z.id,"] ",z.nome); L("      ",z.descrizione);
      if(z.contenuto) L("      Contiene: ",z.contenuto);
      if(z.pericolo&&z.pericolo!=="null") L("      Pericolo: ",z.pericolo);
    }); L("");
    if(arr(o.png).length){ L("PERSONAGGI"); arr(o.png).forEach(p=>L("  • ",p.nome," — ",p.ruolo,p.atteggiamento?" ("+p.atteggiamento+")":"")); L(""); }
    if(arr(o.segreti).length){ L("SEGRETI"); arr(o.segreti).forEach(s=>L("  - ",s)); L(""); }
    if(arr(o.tesori).length){ L("TESORI"); arr(o.tesori).forEach(t=>L("  - ",t)); L(""); }
    if(o.note_dm) L("NOTE DM: ",o.note_dm);
  }
  return R.join("\n");
}

function salva(kind){
  const t=testo(kind); if(!t) return;
  const nomi={storia:"avventura",pg:"personaggio",incontro:"incontro",luogo:"luogo"};
  const b=new Blob([t],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=nomi[kind]+"-"+Date.now()+".txt"; a.click();
  URL.revokeObjectURL(a.href);
}
function copia(kind,btn){
  const t=testo(kind); if(!t) return;
  const fatto=()=>{ const o=btn.textContent; btn.textContent="✓ Copiato"; setTimeout(()=>btn.textContent=o,1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(fatto).catch(ripiego);
  } else ripiego();
  function ripiego(){
    const ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); fatto(); }catch(e){}
    ta.remove();
  }
}

/* ══════ GENERAZIONE ══════ */
function d(n){ return Math.floor(Math.random()*n)+1; }

async function genera(kind){
  const S=ST[kind==="storia"?"storia":kind];
  S.load=true; S.err=null; render();
  try{
    let dati;
    if(kind==="storia") dati=await generaJSON(promptStoria(ST.storia.ed,ST.storia.formato,ST.storia.genere,ST.storia.tema,ST.storia.nPG,ST.storia.lv),4000);
    if(kind==="pg")     dati=await generaJSON(promptPG(ST.pg.ed,ST.pg.tipo,ST.pg.razza,ST.pg.classe,ST.pg.lv,ST.pg.aln,ST.pg.note),4000);
    if(kind==="incontro")dati=await generaJSON(promptIncontro(ST.incontro.ed,ST.incontro.lv,ST.incontro.np,ST.incontro.diff,ST.incontro.contesto),3000);
    if(kind==="luogo")  dati=await generaJSON(promptLuogo(ST.luogo.tipo,ST.luogo.nome,ST.luogo.dim),4000);
    S.out=dati;
  }catch(e){ S.err=e.message||String(e); }
  S.load=false; render();
}

/* ══════ EVENTI ══════ */
function bind(){
  const m=$("#main");
  m.querySelectorAll("[data-set]").forEach(el=>{
    const p=el.dataset.set, [a,b]=p.split(".");
    if(el.tagName==="BUTTON") el.onclick=()=>{ ST[a][b]=el.dataset.val; render(); };
    else if(el.tagName==="SELECT") el.onchange=()=>{ ST[a][b]=el.value; render(); };
    else el.oninput=()=>{ ST[a][b]= el.type==="number" ? Math.max(1,parseInt(el.value||"1",10)) : el.value; };
  });
  m.querySelectorAll("[data-gen]").forEach(b=>b.onclick=()=>genera(b.dataset.gen));
  m.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>salva(b.dataset.save));
  m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copia(b.dataset.copy,b));
  m.querySelectorAll("[data-print]").forEach(b=>b.onclick=()=>window.print());

  /* immagini: se la generazione non risponde si passa alla scena disegnata */
  m.querySelectorAll(".illu-img").forEach(img=>{
    const box=img.parentNode;
    img.onload=()=>{ if(box&&box.classList) box.classList.add("ok"); };
    img.onerror=()=>{
      if(img.dataset.fb && img.src!==img.dataset.fb){ img.src=img.dataset.fb; }
      if(box&&box.classList) box.classList.add("ok");
    };
    if(img.complete && box&&box.classList) box.classList.add("ok");
  });

  m.querySelectorAll("[data-die]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.die; let riga;
    if(k==="adv"||k==="dis"){
      const x=d(20), y=d(20);
      const v=k==="adv"?Math.max(x,y):Math.min(x,y);
      riga=`2d20 ${k==="adv"?"vantaggio":"svantaggio"} → ${v}  (tirati ${x} e ${y})`;
    } else if(k==="stat"){
      const t=[d(6),d(6),d(6),d(6)].sort((p,q)=>p-q);
      riga=`4d6 scarta il minore → ${t[1]+t[2]+t[3]}  (${t.join(", ")})`;
    } else {
      const n=parseInt(k,10), v=d(n);
      riga=`d${n} → ${v}${n===20&&v===20?"  ✦ CRITICO":""}${n===20&&v===1?"  ✖ fallimento critico":""}`;
    }
    ST.dadi.log.unshift(riga); render();
  });
  const c=$("#clr"); if(c) c.onclick=()=>{ ST.dadi.log=[]; render(); };
}

shell(); render();
